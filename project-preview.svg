<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Mental Health Score Predictor project preview</title>
  <desc id="desc">A dark teal web page preview showing the MindMetric header and a form for student lifestyle and social media information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1519"/><stop offset="1" stop-color="#17232a"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5fd0b0" stop-opacity=".13"/><stop offset="1" stop-color="#5fd0b0" stop-opacity="0"/></linearGradient>
    <style>
      text{font-family:Manrope,Arial,sans-serif;fill:#e8eef0}.muted{fill:#97a6ad}.accent{fill:#5fd0b0}.small{font-size:15px}.label{font-size:16px;font-weight:600}.input{fill:#141c21;stroke:#344149;stroke-width:1.5}.heading{font-size:34px;font-weight:800;letter-spacing:-1px}
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <ellipse cx="1080" cy="100" rx="480" ry="250" fill="url(#glow)"/>
  <rect x="0" y="0" width="1440" height="68" fill="#10181d" fill-opacity=".92" stroke="#29343a"/>
  <circle cx="72" cy="34" r="8" fill="#5fd0b0"/><text x="92" y="42" font-size="20" font-weight="800">MindMetric</text>
  <text x="1140" y="41" class="muted" font-size="16">Predict</text><text x="1230" y="41" class="muted" font-size="16">Factors</text><text x="1310" y="41" class="muted" font-size="16">How it works</text>
  <rect x="473" y="108" width="494" height="34" rx="17" fill="#15332e" stroke="#285a4d"/>
  <text x="720" y="131" text-anchor="middle" class="accent" font-size="14" font-weight="700">POWERED BY MACHINE LEARNING</text>
  <text x="720" y="192" text-anchor="middle" class="heading">Mental Health Score Predictor</text>
  <text x="720" y="225" text-anchor="middle" class="muted" font-size="18">Understand how lifestyle and social media habits may influence your mental well-being.</text>
  <text x="720" y="255" text-anchor="middle" class="muted" font-size="15">A model trained on student survey data estimates a score from everyday patterns.</text>
  <rect x="400" y="278" width="260" height="46" rx="13" fill="#5fd0b0"/><text x="530" y="307" text-anchor="middle" fill="#06231c" font-size="15" font-weight="800">Check Your Mental Health Score</text>
  <rect x="270" y="352" width="900" height="570" rx="22" fill="#18222a" stroke="#344149"/>
  <text x="315" y="405" font-size="27" font-weight="700">Tell us about your routine</text>
  <text x="315" y="433" class="muted" font-size="15">All fields are required. Your answers are sent only to the prediction server you run.</text>
  <text x="315" y="478" class="accent" font-size="16" font-weight="700">About you</text>
  <text x="315" y="511" class="label">Age</text><text x="750" y="511" class="label">Gender</text>
  <rect x="315" y="523" width="400" height="48" rx="11" class="input"/><text x="333" y="554" class="muted" font-size="15">20</text>
  <rect x="750" y="523" width="400" height="48" rx="11" class="input"/><text x="768" y="554" class="muted" font-size="15">Select gender</text>
  <text x="315" y="608" class="label">Country</text><text x="750" y="608" class="label">Academic Level</text>
  <rect x="315" y="620" width="400" height="48" rx="11" class="input"/><text x="333" y="651" class="muted" font-size="15">Select country</text>
  <rect x="750" y="620" width="400" height="48" rx="11" class="input"/><text x="768" y="651" class="muted" font-size="15">Select level</text>
  <text x="315" y="705" class="accent" font-size="16" font-weight="700">Social media</text>
  <text x="315" y="739" class="label">Average Daily Usage · hours</text><text x="750" y="739" class="label">Daily Unlocks · per day</text>
  <rect x="315" y="751" width="400" height="48" rx="11" class="input"/><text x="333" y="782" class="muted" font-size="15">5.2</text>
  <rect x="750" y="751" width="400" height="48" rx="11" class="input"/><text x="768" y="782" class="muted" font-size="15">80</text>
  <rect x="315" y="835" width="835" height="54" rx="13" fill="#5fd0b0"/><text x="732" y="869" text-anchor="middle" fill="#06231c" font-size="16" font-weight="800">Predict Mental Health Score</text>
  <text x="720" y="956" text-anchor="middle" class="muted" font-size="14">Project interface preview · FastAPI · scikit-learn · vanilla JavaScript</text>
</svg>
